name: Ceyo Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ v3_openjdk, main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Ceyo yamalari (Belgeler/.minecraft, Mod Yukle)
        run: python3 scripts/ceyo_patch.py

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE 8 / 17 / 21 (resmi Pojav release APK'sindan)
        run: |
          # Eski artifact deposu (android-openjdk-build-multiarch) arsivlendi ve artifact'leri silindi.
          # Release APK'si kalici oldugu icin JRE'leri oradan aliyoruz.
          curl -fL --retry 5 --retry-delay 5 -o /tmp/pojav-release.apk \
            https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          mkdir -p app_pojavlauncher/src/main/assets
          unzip -q -o /tmp/pojav-release.apk \
            'assets/components/jre/*' 'assets/components/jre-new/*' 'assets/components/jre-21/*' \
            -d /tmp/pojav-apk
          cp -r /tmp/pojav-apk/assets/components app_pojavlauncher/src/main/assets/
          ls -la app_pojavlauncher/src/main/assets/components/*
          rm -rf /tmp/pojav-release.apk /tmp/pojav-apk

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/CeyoLauncher-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CeyoLauncher-apk
          path: out/CeyoLauncher-debug.apk
