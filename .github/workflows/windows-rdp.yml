name: Windows Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          Invoke-WebRequest "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" -OutFile tvnc.msi
          $p = $env:VNC_PASSWORD
          Start-Process msiexec.exe -Wait -ArgumentList "/i tvnc.msi /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$p SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1 SET_CONTROLPASSWORD=1 VALUE_OF_CONTROLPASSWORD=$p"
          Start-Sleep -Seconds 5
          New-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name AllowLoopback -PropertyType DWord -Value 1 -Force | Out-Null
          Restart-Service tvnserver
          Start-Sleep -Seconds 5

      - name: Run desktop (noVNC + tunnel + backups, stays alive)
        shell: pwsh
        run: |
          $kal = "C:\Users\runneradmin\Desktop\Kalici"
          $zip = Join-Path $env:RUNNER_TEMP "Kalici.zip"
          $script:lastsig = ""
          function Do-Backup($force) {
            try {
              $files = Get-ChildItem $kal -Recurse -File -ErrorAction SilentlyContinue
              if (-not $files) { return }
              $sig = ($files | ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join ";"
              if ((-not $force) -and ($sig -eq $script:lastsig)) { return }
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Compress-Archive -Path "$kal\*" -DestinationPath $zip -Force
              gh release view backup 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { gh release create backup --title "Kalici yedek" --notes "Otomatik yedek" --prerelease }
              gh release upload backup $zip --clobber
              $script:lastsig = $sig
              Write-Host "backup done"
            } catch { Write-Host "backup error: $_" }
          }
          New-Item -ItemType Directory -Path $kal -Force | Out-Null
          try {
            gh release download backup -p Kalici.zip -D $env:RUNNER_TEMP --clobber
            if (Test-Path $zip) { Expand-Archive $zip -DestinationPath $kal -Force; Write-Host "backup restored" }
          } catch { Write-Host "no backup yet" }

          pip install websockify | Out-Null
          Invoke-WebRequest "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip" -OutFile novnc.zip
          Expand-Archive novnc.zip -DestinationPath .
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

          $script:n = 0
          $script:ws = $null
          $script:cf = $null
          $script:url = $null

          function Start-WS {
            $script:n++
            $script:ws = Start-Process python -ArgumentList "-m websockify --web noVNC-1.5.0 6080 127.0.0.1:5900" -RedirectStandardError "ws$($script:n).err" -RedirectStandardOutput "ws$($script:n).out" -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 4
          }

          function Start-CF {
            $script:n++
            $err = "cf$($script:n).err"
            $script:cf = Start-Process .\cloudflared.exe -ArgumentList "tunnel --url http://127.0.0.1:6080 --no-autoupdate --protocol http2" -RedirectStandardError $err -RedirectStandardOutput "cf$($script:n).out" -PassThru -WindowStyle Hidden
            $script:url = $null
            for ($i = 0; $i -lt 40 -and -not $script:url; $i++) {
              Start-Sleep -Seconds 3
              $m = Select-String -Path $err -Pattern "https://[a-z0-9-]+\.trycloudflare\.com" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($m) { $script:url = $m.Matches[0].Value }
            }
            Start-Sleep -Seconds 8
          }

          function Report {
            $local = try { (Invoke-WebRequest "http://127.0.0.1:6080/vnc.html" -UseBasicParsing -TimeoutSec 10).StatusCode } catch { $_.Exception.Message }
            $pub = try { (Invoke-WebRequest "$($script:url)/vnc.html" -UseBasicParsing -TimeoutSec 15).StatusCode } catch { $_.Exception.Message }
            $vnc = (netstat -ano | findstr ":5900" | Select-Object -First 2) -join " | "
            $link = "$($script:url)/vnc.html?autoconnect=true&resize=scale"
            Write-Host "LINK: $link"
            Write-Host "::notice title=link::$link"
            try {
              Push-Location $env:RUNNER_TEMP
              New-Item -ItemType Directory -Path linkrepo -Force | Out-Null
              Set-Location linkrepo
              "$link`n$local $pub $vnc" | Out-File link.txt -Encoding ascii
              "# Windows desktop`n`n[OPEN DESKTOP]($link)`n`nUpdated: $(Get-Date -Format u)" | Out-File README.md -Encoding ascii
              git init -q
              git config user.email "bot@users.noreply.github.com"
              git config user.name "bot"
              git add link.txt README.md
              git commit -q -m "link"
              git push -q -f "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" HEAD:refs/heads/desktop-link
            } catch { Write-Host $_ }
            Pop-Location
          }

          Start-WS
          Start-CF
          Report

          $end = (Get-Date).AddMinutes(335)
          $lastb = Get-Date
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 20
            if ($script:ws.HasExited) { Write-Host "websockify died, restarting"; Start-WS }
            if ($script:cf.HasExited) { Write-Host "cloudflared died, restarting"; Start-CF; Report }
            if (((Get-Date) - $lastb).TotalMinutes -ge 10) { Do-Backup $false; $lastb = Get-Date }
          }

      - name: Final backup
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $kal = "C:\Users\runneradmin\Desktop\Kalici"
          $zip = Join-Path $env:RUNNER_TEMP "Kalici.zip"
          $script:lastsig = ""
          function Do-Backup($force) {
            try {
              $files = Get-ChildItem $kal -Recurse -File -ErrorAction SilentlyContinue
              if (-not $files) { return }
              $sig = ($files | ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join ";"
              if ((-not $force) -and ($sig -eq $script:lastsig)) { return }
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Compress-Archive -Path "$kal\*" -DestinationPath $zip -Force
              gh release view backup 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { gh release create backup --title "Kalici yedek" --notes "Otomatik yedek" --prerelease }
              gh release upload backup $zip --clobber
              $script:lastsig = $sig
              Write-Host "backup done"
            } catch { Write-Host "backup error: $_" }
          }
          Do-Backup $true

      - name: Start next session
        if: success()
        shell: pwsh
        run: |
          gh workflow run windows-rdp.yml --ref ${{ github.ref_name }}
