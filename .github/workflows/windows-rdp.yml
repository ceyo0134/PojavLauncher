name: Windows Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          Invoke-WebRequest "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" -OutFile tvnc.msi
          $p = $env:VNC_PASSWORD
          Start-Process msiexec.exe -Wait -ArgumentList "/i tvnc.msi /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$p SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1 SET_CONTROLPASSWORD=1 VALUE_OF_CONTROLPASSWORD=$p"
          Start-Sleep -Seconds 5
          New-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name AllowLoopback -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name PollingInterval -PropertyType DWord -Value 100 -Force | Out-Null
          Restart-Service tvnserver
          Start-Sleep -Seconds 5
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Host "defender: $_" }
          try { powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c } catch { }

      - name: Run desktop (noVNC + tunnel + backups, stays alive)
        shell: pwsh
        run: |
          $kal = "C:\Users\runneradmin\Desktop\Kalici"
          $zip = Join-Path $env:RUNNER_TEMP "Kalici.zip"
          $script:lastsig = ""
          function Do-Backup($force) {
            try {
              $files = Get-ChildItem $kal -Recurse -File -ErrorAction SilentlyContinue
              if (-not $files) { return }
              $sig = ($files | ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join ";"
              if ((-not $force) -and ($sig -eq $script:lastsig)) { return }
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Compress-Archive -Path "$kal\*" -DestinationPath $zip -Force
              gh release view backup 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { gh release create backup --title "Kalici yedek" --notes "Otomatik yedek" --prerelease }
              gh release upload backup $zip --clobber
              $script:lastsig = $sig
              Write-Host "backup done"
            } catch { Write-Host "backup error: $_" }
          }
          New-Item -ItemType Directory -Path $kal -Force | Out-Null
          try {
            gh release download backup -p Kalici.zip -D $env:RUNNER_TEMP --clobber
            if (Test-Path $zip) { Expand-Archive $zip -DestinationPath $kal -Force; Write-Host "backup restored" }
          } catch { Write-Host "no backup yet" }

          pip install websockify numpy | Out-Null
          Invoke-WebRequest "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip" -OutFile novnc.zip
          Expand-Archive novnc.zip -DestinationPath .
          try {
            $ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            Invoke-WebRequest "https://raw.githubusercontent.com/$($env:GITHUB_REPOSITORY)/desktop-assets/mobile-controls.js?t=$ts" -OutFile "noVNC-1.5.0\mobile-controls.js"
            $h = Get-Content "noVNC-1.5.0\vnc.html" -Raw
            $h = $h.Replace("</body>", '<script type="module" src="mobile-controls.js"></script></body>')
            Set-Content "noVNC-1.5.0\vnc.html" $h -Encoding utf8
            Write-Host "mobile controls installed"
          } catch { Write-Host "controls not installed: $_" }
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

          $script:n = 0
          $script:ws = $null
          $script:cf = $null
          $script:url = $null

          function Start-WS {
            $script:n++
            $script:ws = Start-Process python -ArgumentList "-m websockify --web noVNC-1.5.0 6080 127.0.0.1:5900" -RedirectStandardError "ws$($script:n).err" -RedirectStandardOutput "ws$($script:n).out" -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 4
          }

          function Start-CF {
            $script:n++
            $err = "cf$($script:n).err"
            $script:cf = Start-Process .\cloudflared.exe -ArgumentList "tunnel --url http://127.0.0.1:6080 --no-autoupdate" -RedirectStandardError $err -RedirectStandardOutput "cf$($script:n).out" -PassThru -WindowStyle Hidden
            $script:url = $null
            for ($i = 0; $i -lt 40 -and -not $script:url; $i++) {
              Start-Sleep -Seconds 3
              $m = Select-String -Path $err -Pattern "https://[a-z0-9-]+\.trycloudflare\.com" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($m) { $script:url = $m.Matches[0].Value }
            }
            Start-Sleep -Seconds 8
          }

          function Report {
            $local = try { (Invoke-WebRequest "http://127.0.0.1:6080/vnc.html" -UseBasicParsing -TimeoutSec 10).StatusCode } catch { $_.Exception.Message }
            $pub = try { (Invoke-WebRequest "$($script:url)/vnc.html" -UseBasicParsing -TimeoutSec 15).StatusCode } catch { $_.Exception.Message }
            $vnc = (netstat -ano | findstr ":5900" | Select-Object -First 2) -join " | "
            $link = "$($script:url)/vnc.html?autoconnect=true&resize=scale&quality=6&compression=9"
            Write-Host "LINK: $link"
            Write-Host "::notice title=link::$link"
            try {
              Push-Location $env:RUNNER_TEMP
              New-Item -ItemType Directory -Path linkrepo -Force | Out-Null
              Set-Location linkrepo
              "$link`n$local $pub $vnc" | Out-File link.txt -Encoding ascii
              "# Windows desktop`n`n[OPEN DESKTOP]($link)`n`nUpdated: $(Get-Date -Format u)" | Out-File README.md -Encoding ascii
              ('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop</title><script>location.replace("' + $link + '")</script><p><a href="' + $link + '">Open desktop</a></p>') | Out-File index.html -Encoding ascii
              git init -q
              git config user.email "bot@users.noreply.github.com"
              git config user.name "bot"
              git add link.txt README.md index.html
              git commit -q -m "link"
              git push -q -f "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" HEAD:refs/heads/desktop-link
              gh api -X POST "repos/$($env:GITHUB_REPOSITORY)/pages/builds" | Out-Null
            } catch { Write-Host $_ }
            Pop-Location
          }

          function Send-Result($text) {
            try {
              if ($text.Length -gt 60000) { $text = $text.Substring(0, 60000) }
              $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
              $repo = $env:GITHUB_REPOSITORY
              $sha = $null
              try { $sha = (gh api "repos/$repo/contents/result.txt?ref=desktop-cmd" 2>$null | ConvertFrom-Json).sha } catch { }
              $body = @{ message = "result"; branch = "desktop-cmd"; content = $b64 }
              if ($sha) { $body.sha = $sha }
              $bf = Join-Path $env:RUNNER_TEMP "body.json"
              $body | ConvertTo-Json | Set-Content $bf -Encoding utf8
              gh api -X PUT "repos/$repo/contents/result.txt" --input $bf | Out-Null
            } catch { Write-Host "send-result error: $_" }
          }

          function Poll-Cmd {
            try {
              $j = gh api "repos/$($env:GITHUB_REPOSITORY)/contents/cmd.ps1?ref=desktop-cmd" 2>$null | ConvertFrom-Json
              if ((-not $j) -or (-not $j.sha)) { return }
              if ($j.sha -eq $script:lastcmd) { return }
              $script:lastcmd = $j.sha
              $code = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($j.content -replace "\s", "")))
              $cf = Join-Path $env:RUNNER_TEMP "cmd.ps1"
              Set-Content $cf $code -Encoding utf8
              $job = Start-Job -ScriptBlock { param($f) & pwsh -NoProfile -File $f 2>&1 | Out-String } -ArgumentList $cf
              Wait-Job $job -Timeout 300 | Out-Null
              $out = Receive-Job $job
              Stop-Job $job -ErrorAction SilentlyContinue
              Send-Result "cmd_sha=$($j.sha)`n$out"
            } catch { Write-Host "poll error: $_" }
          }

          function Diag {
            try {
              $a = Get-Process | Select-Object Id, ProcessName, CPU
              Start-Sleep -Seconds 3
              $b = Get-Process | Select-Object Id, ProcessName, CPU
              $d = foreach ($p in $b) { $o = $a | Where-Object { $_.Id -eq $p.Id } | Select-Object -First 1; if ($o -and $p.CPU -ne $null -and $o.CPU -ne $null) { [pscustomobject]@{ N = $p.ProcessName; D = [math]::Round(($p.CPU - $o.CPU) / 3 * 100, 0) } } }
              $top = ($d | Sort-Object D -Descending | Select-Object -First 7 | ForEach-Object { "$($_.N)=$($_.D)%" }) -join ", "
              $os = Get-CimInstance Win32_OperatingSystem
              $mem = "{0:N0}MB free of {1:N0}MB" -f ($os.FreePhysicalMemory / 1024), ($os.TotalVisibleMemorySize / 1024)
              $res = (Get-CimInstance Win32_VideoController | ForEach-Object { "$($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution)" }) -join ","
              $cpus = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
              $proto = (Select-String -Path "cf*.err" -Pattern "protocol|Registered tunnel|location=" -ErrorAction SilentlyContinue | Select-Object -First 4 | ForEach-Object { $_.Line.Substring([math]::Max(0, $_.Line.Length - 110)) }) -join " | "
              $txt = "time=$(Get-Date -Format u) cpus=$cpus res=$res mem=$mem`ntop(1core=100%): $top`ntunnel: $proto"
              Push-Location (Join-Path $env:RUNNER_TEMP "linkrepo")
              $txt | Out-File diag.txt -Encoding ascii
              git add diag.txt
              git commit -q -m diag
              git push -q -f "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" HEAD:refs/heads/desktop-link
              Pop-Location
            } catch { Write-Host "diag error: $_" }
          }

          Start-WS
          Start-CF
          Report
          Diag
          try { $script:lastcmd = (gh api "repos/$($env:GITHUB_REPOSITORY)/contents/cmd.ps1?ref=desktop-cmd" 2>$null | ConvertFrom-Json).sha } catch { }

          $end = (Get-Date).AddMinutes(335)
          $lastb = Get-Date
          $lastd = Get-Date
          $script:dn = 0
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 8
            Poll-Cmd
            if ($script:ws.HasExited) { Write-Host "websockify died, restarting"; Start-WS }
            if ($script:cf.HasExited) { Write-Host "cloudflared died, restarting"; Start-CF; Report }
            if (((Get-Date) - $lastb).TotalMinutes -ge 10) { Do-Backup $false; $lastb = Get-Date }
            if ((((Get-Date) - $lastd).TotalSeconds -ge 150) -and ($script:dn -lt 12)) { Diag; $script:dn++; $lastd = Get-Date }
          }

      - name: Final backup
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $kal = "C:\Users\runneradmin\Desktop\Kalici"
          $zip = Join-Path $env:RUNNER_TEMP "Kalici.zip"
          $script:lastsig = ""
          function Do-Backup($force) {
            try {
              $files = Get-ChildItem $kal -Recurse -File -ErrorAction SilentlyContinue
              if (-not $files) { return }
              $sig = ($files | ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join ";"
              if ((-not $force) -and ($sig -eq $script:lastsig)) { return }
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Compress-Archive -Path "$kal\*" -DestinationPath $zip -Force
              gh release view backup 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { gh release create backup --title "Kalici yedek" --notes "Otomatik yedek" --prerelease }
              gh release upload backup $zip --clobber
              $script:lastsig = $sig
              Write-Host "backup done"
            } catch { Write-Host "backup error: $_" }
          }
          Do-Backup $true

      - name: Start next session
        if: success()
        shell: pwsh
        run: |
          gh workflow run windows-rdp.yml --ref ${{ github.ref_name }}
