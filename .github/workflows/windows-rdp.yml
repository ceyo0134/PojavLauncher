name: Windows Remote Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 125
    steps:
      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          Invoke-WebRequest "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" -OutFile tvnc.msi
          $p = $env:VNC_PASSWORD
          Start-Process msiexec.exe -Wait -ArgumentList "/i tvnc.msi /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$p SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1 SET_CONTROLPASSWORD=1 VALUE_OF_CONTROLPASSWORD=$p"
          Start-Sleep -Seconds 5

      - name: Run desktop (noVNC + tunnel, stays alive)
        shell: pwsh
        run: |
          pip install websockify | Out-Null
          Invoke-WebRequest "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip" -OutFile novnc.zip
          Expand-Archive novnc.zip -DestinationPath .
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

          $script:n = 0
          $script:ws = $null
          $script:cf = $null
          $script:url = $null

          function Start-WS {
            $script:n++
            $script:ws = Start-Process python -ArgumentList "-m websockify --web noVNC-1.5.0 6080 127.0.0.1:5900" -RedirectStandardError "ws$($script:n).err" -RedirectStandardOutput "ws$($script:n).out" -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 4
          }

          function Start-CF {
            $script:n++
            $err = "cf$($script:n).err"
            $script:cf = Start-Process .\cloudflared.exe -ArgumentList "tunnel --url http://127.0.0.1:6080 --no-autoupdate --protocol http2" -RedirectStandardError $err -RedirectStandardOutput "cf$($script:n).out" -PassThru -WindowStyle Hidden
            $script:url = $null
            for ($i = 0; $i -lt 40 -and -not $script:url; $i++) {
              Start-Sleep -Seconds 3
              $m = Select-String -Path $err -Pattern "https://[a-z0-9-]+\.trycloudflare\.com" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($m) { $script:url = $m.Matches[0].Value }
            }
            Start-Sleep -Seconds 8
          }

          function Report {
            $local = try { (Invoke-WebRequest "http://127.0.0.1:6080/vnc.html" -UseBasicParsing -TimeoutSec 10).StatusCode } catch { $_.Exception.Message }
            $pub = try { (Invoke-WebRequest "$($script:url)/vnc.html" -UseBasicParsing -TimeoutSec 15).StatusCode } catch { $_.Exception.Message }
            $vnc = (netstat -ano | findstr ":5900" | Select-Object -First 2) -join " | "
            Write-Host "=============================================="
            Write-Host "LINK: $($script:url)/vnc.html?autoconnect=true&resize=scale"
            Write-Host "=============================================="
            Write-Host "::notice title=link::$($script:url)/vnc.html?autoconnect=true&resize=scale"
            Write-Host "::notice title=diag::novnc_local=$local public=$pub vnc5900=$vnc"
          }

          Start-WS
          Start-CF
          Report

          $end = (Get-Date).AddMinutes(118)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 20
            if ($script:ws.HasExited) { Write-Host "websockify died, restarting"; Start-WS }
            if ($script:cf.HasExited) { Write-Host "cloudflared died, restarting"; Start-CF; Report }
          }
